<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            background: #0b2545;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            width: 380px;
            border-radius: 8px;
            text-align: center;
        }

        h2 {
            margin-bottom: 24px;
            color: #0b2545;
        }

        .input-group {
            text-align: left;
            margin-bottom: 14px;
        }

        .input-group label {
            font-size: 13px;
            color: #444;
            margin-bottom: 4px;
            display: block;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #ffb703;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 40px;
        }
        
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            user-select: none;
            font-size: 16px;
        }

        .input-group input.error {
            border-color: #e63946;
        }

        .err-msg {
            font-size: 11.5px;
            color: #e63946;
            margin-top: 4px;
            display: none;
        }

        .err-msg.show {
            display: block;
        }

        .forgot-link {
            text-align: right;
            margin-bottom: 16px;
        }

        .forgot-link a {
            font-size: 13px;
            color: #0b2545;
            text-decoration: none;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #ffb703;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 15px;
            font-weight: bold;
            color: #000;
            transition: background 0.2s;
        }

        button:hover {
            background: #e5a800;
        }

        button:disabled {
            background: #ffd75e;
            cursor: not-allowed;
        }

        p {
            margin-top: 18px;
            font-size: 13px;
            color: #555;
        }

        p a {
            color: #0b2545;
            font-weight: bold;
            text-decoration: none;
        }

        p a:hover {
            text-decoration: underline;
        }

        /* Error toast */
        .toast {
            display: none;
            background: #fdecea;
            border: 1px solid #e63946;
            color: #e63946;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: left;
        }

        .toast.show {
            display: block;
        }

        .requirements {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 12px;
            margin-top: -10px;
            font-size: 12px;
            text-align: left;
            display: none;
        }

        .requirements.show {
            display: block;
        }

        .requirement-item {
            margin: 6px 0;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .requirement-check {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
            font-weight: bold;
        }

        .requirement-check.unchecked {
            background: #ccc;
        }

        .requirement-check.checked {
            background: #28a745;
        }

        .requirement-text.unchecked {
            color: #666;
        }

        .requirement-text.checked {
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>User Login</h2>

        <div class="toast" id="toast">❌ Invalid username/email or password.</div>

        <form id="loginForm" autocomplete="off" novalidate action="/api/login" method="post">
            <div class="input-group">
                <label>Email / Username</label>
                <div class="password-wrapper">
                    <input type="text" id="username" name="username" placeholder="Enter your email or username" autocomplete="new-password">
                    <span class="toggle-password" onclick="togglePassword('username', this)"></span>
                </div>
                <div class="err-msg" id="err-username"></div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="new-password">
                    <span class="toggle-password" onclick="togglePassword('password', this)"></span>
                </div>
                <div class="err-msg" id="err-password"></div>
            </div>
            <div id="passwordRequirements" class="requirements">
                <strong>Password Requirements:</strong>
                <div class="requirement-item">
                    <div class="requirement-check unchecked" id="check-password-length">✗</div>
                    <span class="requirement-text unchecked" id="text-password-length">Minimum 8 characters</span>
                </div>
                <div class="requirement-item">
                    <div class="requirement-check unchecked" id="check-password-uppercase">✗</div>
                    <span class="requirement-text unchecked" id="text-password-uppercase">1 Uppercase letter (A-Z)</span>
                </div>
                <div class="requirement-item">
                    <div class="requirement-check unchecked" id="check-password-lowercase">✗</div>
                    <span class="requirement-text unchecked" id="text-password-lowercase">1 Lowercase letter (a-z)</span>
                </div>
                <div class="requirement-item">
                    <div class="requirement-check unchecked" id="check-password-number">✗</div>
                    <span class="requirement-text unchecked" id="text-password-number">1 Number (0-9)</span>
                </div>
                <div class="requirement-item">
                    <div class="requirement-check unchecked" id="check-password-special">✗</div>
                    <span class="requirement-text unchecked" id="text-password-special">1 Special character (!@#$%^&*)</span>
                </div>
            </div>

            <div class="forgot-link">
                <a href="forgot_reset.html">Forgot Password?</a>
            </div>

            <button type="submit" id="loginBtn">Login</button>
        </form>

        <p>Don't have an account? <a href="/register">Register</a></p>
    </div>

    <script>
        const eyeOn = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        const eyeOff = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = eyeOn;
            } else {
                input.type = 'password';
                icon.innerHTML = eyeOff;
            }
        }

        document.querySelectorAll('.toggle-password').forEach(icon => {
            const match = icon.getAttribute('onclick').match(/'([^']+)'/);
            if (match) {
                const input = document.getElementById(match[1]);
                if (input) icon.innerHTML = input.type === 'password' ? eyeOff : eyeOn;
            }
        });

        function showErr(id, msg) {
            const el = document.getElementById('err-' + id);
            const input = document.getElementById(id);
            el.textContent = msg;
            el.classList.add('show');
            input.classList.add('error');
        }

        function clearErr(id) {
            document.getElementById('err-' + id).classList.remove('show');
            document.getElementById(id).classList.remove('error');
        }

        function validateUsername() {
            const val = document.getElementById('username').value.trim();
            if (val === '') {
                showErr('username', 'Email or username is required.');
                return false;
            }
            if (val.length > 100) {
                showErr('username', 'Input too long.');
                return false;
            }
            clearErr('username');
            return true;
        }

        function validatePassword() {
            const val = document.getElementById('password').value;
            if (val === '') {
                showErr('password', 'Password is required.');
                return false;
            }
            if (val.length > 100) {
                showErr('password', 'Password too long.');
                return false;
            }
            clearErr('password');
            return true;
        }

        // ═══════════════════════════════════════════════════════
        //  PASSWORD STRENGTH VALIDATION
        // ═══════════════════════════════════════════════════════

        function validatePasswordStrength(password) {
            return {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /[0-9]/.test(password),
                special: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password)
            };
        }

        function updatePasswordRequirementUI(validation) {
            const requirements = Object.keys(validation);
            requirements.forEach(req => {
                const checkElement = document.getElementById(`check-password-${req}`);
                const textElement = document.getElementById(`text-password-${req}`);
                if (checkElement && textElement) {
                    if (validation[req]) {
                        checkElement.textContent = '✓';
                        checkElement.className = 'requirement-check checked';
                        textElement.className = 'requirement-text checked';
                    } else {
                        checkElement.textContent = '✗';
                        checkElement.className = 'requirement-check unchecked';
                        textElement.className = 'requirement-text unchecked';
                    }
                }
            });
        }

        document.getElementById('password').addEventListener('input', function() {
            const requirements = validatePasswordStrength(this.value);
            updatePasswordRequirementUI(requirements);
            if (this.value.length > 0) {
                document.getElementById('passwordRequirements').classList.add('show');
            }
        });

        document.getElementById('password').addEventListener('blur', function() {
            if (this.value.length === 0) {
                document.getElementById('passwordRequirements').classList.remove('show');
            }
            validatePassword();
        });

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            document.getElementById('toast').classList.remove('show');

            const v1 = validateUsername();
            const v2 = validatePassword();

            if (v1 && v2) {
                const btn = document.getElementById('loginBtn');
                btn.textContent = 'Logging in...';
                btn.disabled = true;

                fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            window.location.href = data.redirect_url || '/dashboard';
                        } else {
                            document.getElementById('toast').textContent = "❌ " + (data.error || "Login failed");
                            document.getElementById('toast').classList.add('show');
                            btn.textContent = 'Login';
                            btn.disabled = false;
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        document.getElementById('toast').textContent = "❌ Network error. Please try again.";
                        document.getElementById('toast').classList.add('show');
                        btn.textContent = 'Login';
                        btn.disabled = false;
                    });
            }
        });
    </script>

</body>

</html>
